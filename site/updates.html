<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Latest updates — LessonCenter</title>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container row between middle">
      <a class="brand row middle" href="/">
        <img alt="LessonCenter" src="/assets/img/logo.svg" width="36" height="36">
        <span>LessonCenter</span>
      </a>
      <nav class="nav">
        <a href="/#programmes">Programs</a>
        <a href="/#testimonials">Testimonials</a>
        <a href="/#faq">FAQ</a>
        <a href="/contact.html" class="btn">Contact</a>
      </nav>
    </div>
  </header>

  <main class="page container">
    <h1>Latest updates</h1>
    <ul id="updates-list"></ul>
    <p class="small"><a href="/">← Back to home</a></p>
  </main>

  <script>
  (async () => {
    try {
      const res = await fetch('/assets/updates.json', { cache: 'no-store' });
      const data = res.ok ? await res.json() : [];
      const ul = document.getElementById('updates-list');
      const newsOnly = Array.isArray(data) ? data.filter(it => it && it.kind !== 'heartbeat') : [];

      if (!ul) return;
      if (!newsOnly.length) { ul.innerHTML = '<li>No updates yet.</li>'; return; }

      const fmt = new Intl.DateTimeFormat('en-GB', { dateStyle: 'medium', timeStyle: 'short' });
      ul.innerHTML = '';
      newsOnly.forEach(it => {
        const li = document.createElement('li');
        const ts = it && it.ts ? new Date(it.ts) : new Date();
        li.textContent = `${fmt.format(ts)} — ${it.msg || ''}`;
        ul.appendChild(li);
      });
    } catch {
      const ul = document.getElementById('updates-list');
      if (ul) ul.innerHTML = '<li>Unable to load updates.</li>';
    }
  })();
  </script>
</body>
</html>
