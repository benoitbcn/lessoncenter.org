<!doctype html>
<html lang="en">

<body>

<div class="container">
  <h1>Resources</h1>
  <div class="card">
    <p>Feed below is driven by a dynamic API (<code>/api/posts</code>). Edit it later to connect a real source.</p>
  </div>
  <div id="list" class="grid"></div>
</div>
<script>
(async () => {
  const wrap = document.getElementById('list');
  wrap.innerHTML = '<div class="card">Loading…</div>';
  try {
    const r = await fetch('/api/posts');
    const data = await r.json();
    const posts = data.posts || [];
    wrap.innerHTML = '';
    posts.forEach(p => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<h3>${p.title}</h3><p>${p.summary||''}</p><p><a href="${p.url}" target="_blank" rel="noopener">Open</a></p>`;
      wrap.appendChild(card);
    });
    if (!posts.length) wrap.innerHTML = '<div class="card">No posts yet.</div>';
  } catch(e) {
    wrap.innerHTML = '<div class="card">Failed to load posts.</div>';
  }
})();
</script>


    <footer class="container">
      <small>© 2025 LessonCenter • Built on Cloudflare Pages + Functions</small>
    </footer>
    
</body>
</html>
