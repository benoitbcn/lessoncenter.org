name: Auto rotate news

on:
  schedule:
    - cron: '0 7 * * MON'   # chaque Lundi 07:00 UTC
  workflow_dispatch:        # tu peux aussi le lancer une fois maintenant

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add weekly news from seeds
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const seedsPath = 'site/assets/news-seed.json';
          const statePath = 'site/assets/news-state.json';
          const updatesPath = 'site/assets/updates.json';

          // charge seeds
          const seeds = JSON.parse(fs.readFileSync(seedsPath,'utf8'));
          if (!Array.isArray(seeds) || !seeds.length) process.exit(0);

          // charge état (index courant)
          let state = { lastIndex: -1 };
          try { state = JSON.parse(fs.readFileSync(statePath,'utf8')); } catch(e) {}

          // pick next index (rotation)
          const nextIndex = (Number(state.lastIndex) + 1) % seeds.length;
          const msg = seeds[nextIndex];

          // charge updates.json
          let arr = [];
          try { arr = JSON.parse(fs.readFileSync(updatesPath,'utf8')||'[]'); } catch(e) { arr = []; }

          // évite d'empiler la même news si déjà tout en haut
          if (arr[0] && arr[0].kind !== 'heartbeat' && arr[0].msg === msg) {
            console.log('Top news already same, skipping.');
            process.exit(0);
          }

          // ajoute l'entrée
          const now = new Date().toISOString();
          arr.unshift({ ts: now, kind: 'news', msg });

          // écrit fichiers
          fs.writeFileSync(updatesPath, JSON.stringify(arr, null, 2));
          fs.writeFileSync(statePath, JSON.stringify({ lastIndex: nextIndex }, null, 2));
          NODE

      - name: Commit & push
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add site/assets/updates.json site/assets/news-state.json
          git commit -m "chore: weekly auto-news" || echo "no changes"
          git push
