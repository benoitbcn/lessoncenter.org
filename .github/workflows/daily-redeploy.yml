name: Daily rebuild
on:
  schedule:
    - cron: '0 6 * * *'   # tous les jours à 06:00 UTC (08:00 à Paris l'été)
  workflow_dispatch:       # bouton "Run workflow" manuel
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit to trigger Pages deploy
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git commit --allow-empty -m "chore: daily rebuild"
          git push
