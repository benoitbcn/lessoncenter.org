name: Daily rebuild

on:
  schedule:
    # tous les jours à 05:14 UTC (mets l'heure que tu veux)
    - cron: '14 5 * * *'
  workflow_dispatch:

permissions:
  contents: write  # IMPORTANT: permet de pousser

jobs:
  touch-build-stamp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update build.txt (UTC timestamp)
        run: |
          mkdir -p site/assets
          date -u +"%Y-%m-%dT%H:%M:%SZ" > site/assets/build.txt
          echo "Build stamp -> $(cat site/assets/build.txt)"

      - name: Commit & push (ignore 'nothing to commit')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/build.txt
          git commit -m "chore: daily rebuild [skip ci]" || echo "Nothing to commit"
          git push
